<!DOCTYPE html>
<html>
    <style>
        div{
            border: 2px solid black;
            padding: 20px; 
            border-radius: 10px;
            width: 300px; 
            background-color: #f9f9f9;
            
        }
        .a1{
            background-color: white;
            padding:5px;
            margin:10px;
            width:200px;
            border-radius: 7px;
            height:30px;
        }
        .b1{
            background-color: rgb(0, 119, 255);
            padding:12px;
            color:white;
            transition: box-shadow 1s,reset 1s;
            margin:20px;
            border-radius: 10px;
            border:none;
        }
        .b1:hover{
            box-shadow: 2px 2px 9px black;
        }
    </style>
    <body>
        <center>
        <div>   
            <P>WELCOME TO LOGIN PAGE</P>
            <input type="username" placeholder="Enter Username" class="a1"></br>
            <input type="password" placeholder="Enter password" class="a1"></br>
            <button type="reset" class="b1">Reset</button>
            <a href="https://www.google.com" target="_blank"><button class="b1">Log In</button></a>
        </div>
        </center>        
    </body>
</html>
