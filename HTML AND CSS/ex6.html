<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>NAV BAR</title>
      <style>
            * {
                  padding: 0;
                  margin: 0;
            }

            header {
                  margin: 2vh 0;
                  width: 90vw;
                  height: 10vh;
                  display: flex;
                  justify-content: space-evenly;
                  align-items: center;
            }

            .image img {
                  cursor: pointer;
                  width: 12vw;

            }

            .menu ul {
                  display: flex;
                  justify-content: space-around;
                  gap: 5vw;
                  list-style: none;
                  flex-wrap: wrap;
            }

            .menu ul li {
                  font-size: 1.1rem;
                  cursor: pointer;
            }

            .btn button {
                  border: 2px solid black;
                  width: 8vw;
                  height: 4vh;
                  background-color: antiquewhite;
                  border-radius: 2vw;
                  cursor: pointer;
            }

            .first {
                  display: flex;
                  flex-direction: column;
                  justify-content: center;
                  align-items: center;
                  gap: 5vh;
                  margin-top: 10vh;
            }

            .first h1 {
                  font-family: 'Segoe UI';
                  font-weight: 400;
                  font-size: 3rem;
            }

            .first p {
                  text-align: center;
                  width: 50vw;
                  font-size: 1.3rem;
                  word-wrap: break-word;
            }

            .first button {
                  background-color: #00b6d1;
                  border: none;
                  padding: 16px;
                  color: white;
                  font-weight: 700;
                  border-radius: 5px;
            }

            .second {}
      </style>
</head>

<body>
      <header>
            <div class="image"><img src="https://www.ultraedit.com/wp-content/uploads/2023/01/Background-2.png" alt="">
            </div>

            <div class="menu">
                  <ul>
                        <li>Product</li>
                        <li>Pricing</li>
                        <li>Resources</li>
                        <li>Our Company</li>
                  </ul>
            </div>
            <div class="btn">
                  <button>BUY</button>

            </div>
      </header>
      <main>
            <section class="first">
                  <h1>Download <strong>Ultraedit</strong> for Windows <span><img
                                    src="https://www.ultraedit.com/wp-content/uploads/2022/10/Reviews.png"
                                    alt=""></span></h1>
                  <p>Download and try UltraEdit before you buy it! This download includes the full Windows version of
                        the text
                        editor.</p>
                  <button>DOWNLOAD MAC OR LINUX VERISON</button>
            </section>
            <section class="second">
                  <span>Download UltraEdit</span>
                  <span>v2025.0.0.39 (released 2025-08-06) | Latest changes</span>
            </section>
      </main>
</body>

</html>
