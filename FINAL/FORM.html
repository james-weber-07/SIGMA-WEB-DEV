<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>FORMS</title>
      <style>
            form{
                  display:flex;
            }
      </style>
</head>
<body>
      <form action="/sumbit" method="post">
            <label for="username">USERNAME</label>
            <input  name="Username" id="username" type="text" placeholder="ENTER USERNAME" required>
            <label for="pass">PASSWORD</label>
            <input  name="Password" id="pass" type="password" placeholder="ENTER PASSWORD" required>
            <input name="gender" id="m" type="radio"  value="Male">
            <label for="m">Male</label>
            <input name="gender" id="f" type="radio"  value="Female">
            <label for="f">Female</label>
      </form>
</body>
</html>
